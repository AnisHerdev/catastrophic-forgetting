[project]
name = "catastrophic-forgetting"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "anisherdev", email = "anisherdev@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.70.1",
]

[project.scripts]
catastrophic-forgetting = "catastrophic_forgetting:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
